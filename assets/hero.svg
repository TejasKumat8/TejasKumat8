<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="60%" stop-color="#0b0f2a"/>
      <stop offset="100%" stop-color="#11092b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a5a" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" height="320" width="0">
        <animate attributeName="width" values="0;1000;1000;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono { font-family: 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .name { font-size: 76px; font-weight: 800; letter-spacing: 6px; }
      .ghost-c { fill: #00f0ff; opacity: 0; animation: glitchC 4s infinite steps(1); }
      .ghost-m { fill: #ff2bd6; opacity: 0; animation: glitchM 4s infinite steps(1); }
      @keyframes glitchC { 0%,86%,100% { opacity: 0; transform: translate(0,0); } 88% { opacity: .8; transform: translate(-5px,2px); } 92% { opacity: .6; transform: translate(4px,-2px); } }
      @keyframes glitchM { 0%,87%,100% { opacity: 0; transform: translate(0,0); } 89% { opacity: .8; transform: translate(5px,-1px); } 93% { opacity: .6; transform: translate(-4px,2px); } }
      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
      .float1 { animation: float 7s ease-in-out infinite; }
      .float2 { animation: float 9s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-18px); opacity: .9; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="18" fill="url(#grid)" opacity="0.45"/>
  <rect class="scan" x="0" y="0" width="1000" height="40" fill="#00f0ff" opacity="0.05"/>

  <!-- floating particles -->
  <g class="float1"><circle cx="90" cy="250" r="3" fill="#00f0ff"/><circle cx="880" cy="80" r="2.5" fill="#ff2bd6"/><circle cx="760" cy="260" r="2" fill="#7b5cff"/></g>
  <g class="float2"><circle cx="180" cy="70" r="2" fill="#ff2bd6"/><circle cx="930" cy="230" r="3" fill="#00f0ff"/><circle cx="620" cy="50" r="2" fill="#7b5cff"/></g>

  <!-- HUD corners -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.8">
    <path d="M24 64V24H64"/><path d="M936 24H976V64"/><path d="M976 256V296H936"/><path d="M64 296H24V256"/>
  </g>

  <!-- terminal header -->
  <g class="mono" font-size="14" fill="#6b7aa8">
    <circle cx="52" cy="48" r="6" fill="#ff5f56"/><circle cx="72" cy="48" r="6" fill="#ffbd2e"/><circle cx="92" cy="48" r="6" fill="#27c93f"/>
    <text x="118" y="53">~/tejas — zsh</text>
    <text x="926" y="53" text-anchor="end" fill="#27c93f">● online</text>
  </g>

  <!-- name with glitch -->
  <g class="mono name" text-anchor="middle">
    <text class="ghost-c" x="500" y="160">TEJAS KUMAT</text>
    <text class="ghost-m" x="500" y="160">TEJAS KUMAT</text>
    <text x="500" y="160" fill="url(#neon)" filter="url(#glow)">TEJAS KUMAT</text>
  </g>

  <!-- typed subtitle -->
  <g class="mono" font-size="24" text-anchor="middle" clip-path="url(#typeClip)">
    <text x="500" y="215" fill="#c9d1ff"><tspan fill="#27c93f">❯</tspan> Backend &amp; AI Engineer · Building things that ship<tspan class="cursor" fill="#00f0ff"> ▌</tspan></text>
  </g>

  <!-- tags -->
  <g class="mono" font-size="15" text-anchor="middle">
    <g transform="translate(290,262)"><rect x="-62" y="-20" width="124" height="30" rx="15" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff"/><text y="1" fill="#00f0ff">Python</text></g>
    <g transform="translate(430,262)"><rect x="-62" y="-20" width="124" height="30" rx="15" fill="#7b5cff" fill-opacity="0.15" stroke="#7b5cff"/><text y="1" fill="#b9a8ff">FastAPI</text></g>
    <g transform="translate(570,262)"><rect x="-62" y="-20" width="124" height="30" rx="15" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6"/><text y="1" fill="#ff8ae9">AI / RAG</text></g>
    <g transform="translate(710,262)"><rect x="-62" y="-20" width="124" height="30" rx="15" fill="#27c93f" fill-opacity="0.12" stroke="#27c93f"/><text y="1" fill="#7dfc94">Cloud</text></g>
  </g>
</svg>
