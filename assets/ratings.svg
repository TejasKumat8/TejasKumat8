<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs><style>@font-face{font-family:'Rounded';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Rounded';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1520"/><stop offset="1" stop-color="#5a2340"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>
  <rect width="1000" height="230" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="60" fill="url(#band)" clip-path="url(#card)">
    <animate attributeName="y" from="-60" to="230" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="58" cy="43" r="5"><animate attributeName="r" from="5" to="26" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="58" cy="43" r="5"><animate attributeName="r" from="5" to="26" dur="1.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffb066"><rect x="306" y="36" width="4" height="14" rx="1"><animate attributeName="height" values="6;14;10;4;6" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="44;36;40;46;44" dur="0.9s" repeatCount="indefinite"/></rect><rect x="313" y="36" width="4" height="14" rx="1"><animate attributeName="height" values="12;14;5;4;12" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="38;36;45;46;38" dur="1.1s" repeatCount="indefinite"/></rect><rect x="320" y="36" width="4" height="14" rx="1"><animate attributeName="height" values="4;14;12;4;4" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="46;36;38;46;46" dur="0.8s" repeatCount="indefinite"/></rect><rect x="327" y="36" width="4" height="14" rx="1"><animate attributeName="height" values="9;14;6;4;9" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="41;36;44;46;41" dur="1.3s" repeatCount="indefinite"/></rect><rect x="334" y="36" width="4" height="14" rx="1"><animate attributeName="height" values="11;14;3;4;11" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="39;36;47;46;39" dur="1.0s" repeatCount="indefinite"/></rect></g>
  <g font-family="'Rounded','Segoe UI',Arial,sans-serif">
    <rect x="40" y="30" width="92" height="26" rx="13" fill="#e0405a"/>
    <circle cx="58" cy="43" r="5" fill="#fff"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="70" y="48" font-size="13" font-weight="800" fill="#fff" letter-spacing="2">ON AIR</text>
    <text x="146" y="48" font-size="13" fill="#ffd9b0" letter-spacing="3">VIEWER RATINGS</text>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 26" to="0 0" begin="0.2s" dur="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      <text x="38" y="128" font-size="72" font-weight="800" fill="#fff4e6" filter="url(#glow)">89<animate attributeName="opacity" values="1;0.85;1;0.92;1" dur="3s" repeatCount="indefinite"/></text>
    </g>
    <text x="42" y="156" font-size="14" fill="#ffd9b0">people watched the pilot · <tspan fill="#ffc977" font-weight="700">premiere week</tspan></text>
    <text x="42" y="190" font-size="13" fill="#fff0dc">status: <tspan font-weight="800" fill="#ffb066">indie pilot</tspan> <tspan font-style="italic" fill="#c9a08a">· my mom watched. twice.</tspan></text>
    <text x="42" y="210" font-size="11" fill="#b58a7c">11 more viewers until: cult following</text>
    <path d="M590 170 H950" stroke="#7a3d55" stroke-width="1"/>
    <path d="M590 150 H950" stroke="#ffc977" stroke-width="2.5" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></path><circle cx="950" cy="150" r="5" fill="#fff1b8"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="950" y="196" text-anchor="end" font-size="11" font-style="italic" fill="#b58a7c">the ratings chart premieres after the next broadcast</text>
  </g>
</svg>
