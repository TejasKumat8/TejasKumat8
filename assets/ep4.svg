<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="104" viewBox="0 0 1000 104">
  <defs><style>@font-face{font-family:'Rounded';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Rounded';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}</style>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#4a1d3a"/><stop offset="0.45" stop-color="#2a1520"/><stop offset="1" stop-color="#2a1520" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e0595a"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc977"/><stop offset="0.6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e0595a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe3c7" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="6" width="1000" height="92" rx="20"/></clipPath>
  </defs>
  <rect x="0" y="6" width="1000" height="92" rx="20" fill="url(#card)"/>
  <rect x="-260" y="6" width="220" height="92" fill="url(#shine)" clip-path="url(#frame)">
    <animate attributeName="x" values="-260;1040;1040" keyTimes="0;0.55;1" dur="6s" begin="2.4000000000000004s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
    <path d="M28 30 H128 L116 74 H16 Z" fill="url(#tag)"/>
    <path d="M28 30 H128 L126 36 H26 Z" fill="#fff" opacity="0.25"/>
    <text x="72" y="60" text-anchor="middle" font-family="'Rounded','Segoe UI',Arial,sans-serif" font-size="19" font-weight="800" font-style="italic" fill="#fff8ee" letter-spacing="1">EP.04</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.15s" dur="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
    <text x="150" y="52" font-family="'Rounded','Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#fff4e6"><tspan fill="#ff9a4d">「</tspan>world building<tspan fill="#ff9a4d">」</tspan></text>
    <text x="154" y="82" font-family="'Rounded','Segoe UI',Arial,sans-serif" font-size="14" fill="#d9b3a0">I build a city every year. one commit at a time.</text>
  </g>
  <path d="M156 62 Q274 66 397 60" fill="none" stroke="url(#brush)" stroke-width="4" stroke-linecap="round"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.5s" dur="0.9s" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
  </path>

  <g transform="translate(944 52)">
    <circle r="22" fill="#ffb347" opacity="0.18"><animate attributeName="r" values="18;26;18" dur="4s" repeatCount="indefinite"/></circle>
    <circle r="13" fill="#ffc977"/>
    <rect x="-14" y="3" width="28" height="2" fill="#2a1520"/>
    <rect x="-14" y="8" width="28" height="3" fill="#2a1520"/>
  </g>
  <g fill="#fff1c9">
    <path d="M894 30 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.8999999999999999s" repeatCount="indefinite"/></path>
    <path d="M980 78 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="1.9s" repeatCount="indefinite"/></path>
    <path d="M912 80 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1z"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></path>
  </g>
</svg>
